name: Probe Godot PCK trimming for Myeongnyang public demo
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mn-public-demo-pck-probe.yml"
      - ".github/scripts/mn_pck_inspect.gd"
permissions:
  contents: read
jobs:
  inspect-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Inspect and repack a tiny subpack from MN-B44 public test PCK
        run: |
          set -euo pipefail
          test -s "myeongnyang-test/index.pck"
          godot --headless --script "$GITHUB_WORKSPACE/.github/scripts/mn_pck_inspect.gd" -- "$GITHUB_WORKSPACE/myeongnyang-test/index.pck" > probe.log 2>&1 || { cat probe.log; exit 1; }
          grep -Fq "PCK_LOADED=true" probe.log
          grep -Fq "PCK_DATA_FILE_EXISTS=true" probe.log
          grep -Fq "PACKER_ADD=0" probe.log
          cat probe.log | tail -70
      - uses: actions/upload-artifact@v4
        with:
          name: mn-b44-pck-repack-probe
          path: probe.log
          retention-days: 7

name: Publish verified Chapter 1 Acts 1–2 demo
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-hansan-demo.yml]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://walexjung.github.io/hansan-demo/
    steps:
      - uses: actions/checkout@v4
      - name: Stage verified demo
        env:
          DEMO_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-2e88-8209-9ae4-e1d77ad7d6c2/raw?se=2026-11-18T11%3A34%3A36Z&sp=r&sv=2026-06-06&sr=b&scid=ad577514-9bb3-4a0c-94d6-a858863ee0fc&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T04%3A18%3A41Z&ske=2026-11-19T04%3A18%3A41Z&sks=b&skv=2026-06-06&sig=2SwZccrNpgQsgCB4L/P3WaHISp%2B97BQscGqX/uqlRKk%3D"
          DEMO_SHA256: "f4b2cd93f9dd961b08abaebdaf185d8060a077f1827e0c96bb023dfe8d5103b2"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 180 "$DEMO_URL" -o "$RUNNER_TEMP/demo.zip"
          echo "$DEMO_SHA256  $RUNNER_TEMP/demo.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/demo"
          unzip -q "$RUNNER_TEMP/demo.zip" -d "$RUNNER_TEMP/demo"
          source=$(dirname "$(find "$RUNNER_TEMP/demo" -type f -name index.pck -print -quit)")
          for file in index.html index.js index.pck index.wasm; do
            test -s "$source/$file"
          done
          grep -Fxq DEMO_PACK_SCOPE_VERIFIED "$RUNNER_TEMP/demo/web-logs/demo-pack.log"
          grep -Fq 'hansan-enable-audio' "$source/index.html"
          mkdir -p "$RUNNER_TEMP/site/hansan-demo"
          cp -a "$source/." "$RUNNER_TEMP/site/hansan-demo/"
          touch "$RUNNER_TEMP/site/hansan-demo/.nojekyll"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser startup and audio activation before publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --silent playwright@1.58.2
          if command -v google-chrome >/dev/null; then
            export BROWSER_CHROME_BIN=$(command -v google-chrome)
          else
            npx playwright install chromium
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" >"$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:8765/hansan-demo/ >/dev/null && break
            sleep 1
          done
          mkdir -p qa-v120-web
          cat > qa-v120-web/check.cjs <<'JS'
          const {chromium} = require('playwright');
          (async () => {
            const browser=await chromium.launch({
              headless:true,
              executablePath:process.env.BROWSER_CHROME_BIN || undefined,
              args:['--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader',
                    '--autoplay-policy=user-gesture-required','--no-sandbox']
            });
            const context=await browser.newContext({viewport:{width:1280,height:720}});
            const page=await context.newPage();
            const errors=[];
            const consoleLines=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+r.failure()?.errorText));
            page.on('console',m=>{if(m.type()==='error')consoleLines.push(m.text())});
            await page.addInitScript(() => {
              window.__hansanAudioContexts=[];
              for(const key of ['AudioContext','webkitAudioContext']){
                const Base=window[key];
                if(!Base)continue;
                function Capture(){
                  const ctx=Reflect.construct(Base,Array.from(arguments),Base);
                  window.__hansanAudioContexts.push(ctx);
                  return ctx;
                }
                Object.setPrototypeOf(Capture,Base);
                Capture.prototype=Base.prototype;
                window[key]=Capture;
              }
            });
            const target='http://127.0.0.1:8765/hansan-demo/?audioqa='+Date.now();
            console.log('CHECK_WEB_URL',target);
            await page.goto(target,{waitUntil:'domcontentloaded',timeout:120000});
            const button=page.locator('#hansan-enable-audio');
            await button.waitFor({state:'visible',timeout:160000});
            console.log('V120_WEB_LOADED_AUDIO_START_BUTTON');
            const before=await page.evaluate(()=>window.__hansanAudioContexts.map(c=>c.state));
            console.log('AUDIO_CONTEXT_BEFORE_CLICK',JSON.stringify(before));
            await button.click();
            await page.waitForTimeout(2000);
            const after=await page.evaluate(()=>window.__hansanAudioContexts.map(c=>c.state));
            console.log('AUDIO_CONTEXT_AFTER_CLICK',JSON.stringify(after));
            const size=await page.locator('#canvas').evaluate(c=>[c.width,c.height]);
            console.log('GAME_CANVAS_SIZE',JSON.stringify(size));
            await page.screenshot({path:'qa-v120-web/after-audio-start.png'});
            if(errors.length)console.log('BROWSER_ERRORS',JSON.stringify(errors.slice(0,30)));
            if(consoleLines.length)console.log('CONSOLE_ERRORS',JSON.stringify(consoleLines.slice(0,30)));
            const ok=after.length>0 && after.every(x=>x==='running') && size[0]>0 && size[1]>0;
            console.log('V120_BROWSER_AUDIO_UNLOCK',ok?'PASS':'FAIL');
            await browser.close();
            if(!ok)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa-v120-web/check.cjs | tee qa-v120-web/results.log
      - name: Replace the public demo files
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/site/hansan-demo/index.pck"
          git rm -r --ignore-unmatch -- hansan-demo
          mkdir -p hansan-demo
          cp -a "$RUNNER_TEMP/site/hansan-demo/." hansan-demo/
          git add -- hansan-demo
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish V120 demo limited to Chapter 1 Acts 1–2'
          git push origin HEAD:main
          echo "PUBLIC_DEMO_COMMIT=$(git rev-parse HEAD)"
          echo "PUBLIC_DEMO_PCK_SHA256=$(sha256sum hansan-demo/index.pck | cut -d ' ' -f1)"
      - name: Stage complete Pages site
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/pages"
          rm -rf "$RUNNER_TEMP/pages/.github"
          echo "DEMO_PCK_SHA256=$(sha256sum hansan-demo/index.pck | cut -d ' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - uses: actions/deploy-pages@v4
      - name: Confirm live Pages serves the verified demo pack
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl -fsSL --max-time 45 "https://walexjung.github.io/hansan-demo/index.pck?demoverify=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/live.pck" &&
               echo "$DEMO_PCK_SHA256  $RUNNER_TEMP/live.pck" | sha256sum -c -; then
              exit 0
            fi
            sleep 6
          done
          exit 1

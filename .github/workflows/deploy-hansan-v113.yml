name: Deploy Hansan V113 Web Demo
on:
  workflow_dispatch:
    inputs:
      confirm_demo_only:
        description: "Confirm V113 ZIP is safe to publish (type DEMO_ONLY after reviewing game content)"
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.confirm_demo_only == 'DEMO_ONLY'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout existing website
        uses: actions/checkout@v4
      - name: Download and verify V113 demo ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hansan-source /tmp/hansan-extract
          gh release download hansan-v113-web --repo "${{ github.repository }}" \
            --pattern "hansan-web-demo-V113-VERIFIED.zip" \
            --dir /tmp/hansan-source --clobber
          echo "e7d59fe6d2d783f550f022ec0e49e732328c2f781a194e23983d0d84697c5dcf  /tmp/hansan-source/hansan-web-demo-V113-VERIFIED.zip" | sha256sum -c - || {
            echo "::error::Release ZIP differs from the verified V113 original. Replace the release asset with the verified ZIP before retrying."
            exit 1
          }
          unzip -tq /tmp/hansan-source/hansan-web-demo-V113-VERIFIED.zip
          unzip -q /tmp/hansan-source/hansan-web-demo-V113-VERIFIED.zip -d /tmp/hansan-extract
          for name in index.html index.pck index.wasm index.js; do
            test -s "/tmp/hansan-extract/$name" || { echo "::error::Missing or empty file: $name"; exit 1; }
          done
      - name: Prepare Pages site preserving existing homepage
        run: |
          mkdir -p /tmp/pages-site
          tar --exclude=.git --exclude=.github -cf - . | (cd /tmp/pages-site && tar -xf -)
          rm -rf /tmp/pages-site/hansan-demo
          mkdir -p /tmp/pages-site/hansan-demo
          cp -a /tmp/hansan-extract/. /tmp/pages-site/hansan-demo/
          touch /tmp/pages-site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

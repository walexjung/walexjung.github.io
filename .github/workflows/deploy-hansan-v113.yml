name: Deploy Hansan V113 Web Demo
on:
  workflow_dispatch:
    inputs:
      confirm_demo_only:
        description: "Confirm V113 ZIP is safe to publish (type DEMO_ONLY after reviewing game content)"
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.confirm_demo_only == 'DEMO_ONLY'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout existing website
        uses: actions/checkout@v4
      - name: Download verified demo ZIP from this repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/hansan-source /tmp/hansan-extract
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | .assets[]? | select(.name == "hansan-web-demo-V113.zip") | .id' > /tmp/hansan-source/asset_ids.txt
          ASSET_ID="$(head -n 1 /tmp/hansan-source/asset_ids.txt)"
          test -n "$ASSET_ID" || { echo "ERROR: V113 release asset not found"; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$ASSET_ID" > /tmp/hansan-source/hansan-web-demo-V113.zip
          unzip -tq /tmp/hansan-source/hansan-web-demo-V113.zip
          unzip -q /tmp/hansan-source/hansan-web-demo-V113.zip -d /tmp/hansan-extract
          test -s /tmp/hansan-extract/index.html
          test -s /tmp/hansan-extract/index.pck
          test -s /tmp/hansan-extract/index.wasm
          test -s /tmp/hansan-extract/index.js
      - name: Prepare Pages site preserving existing homepage
        run: |
          mkdir -p /tmp/pages-site
          tar --exclude=.git --exclude=.github -cf - . | (cd /tmp/pages-site && tar -xf -)
          rm -rf /tmp/pages-site/hansan-demo
          mkdir -p /tmp/pages-site/hansan-demo
          cp -a /tmp/hansan-extract/. /tmp/pages-site/hansan-demo/
          touch /tmp/pages-site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

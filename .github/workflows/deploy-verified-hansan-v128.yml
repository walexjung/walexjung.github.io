name: Deploy verified V128 Hansan bilingual web demo
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-verified-hansan-v128.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    environment:
      name: github-pages
      url: https://walexjung.github.io/hansan-demo/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch SHA256-verified V128 demo build artifact
        env:
          DEMO_ARCHIVE_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-e824-8211-a18b-c906f6f46beb/raw?se=2026-11-20T05%3A41%3A03Z&sp=r&sv=2026-06-06&sr=b&scid=65932def-ff38-59ef-9516-d329981f00b2&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-20T03%3A19%3A11Z&ske=2026-11-21T03%3A19%3A11Z&sks=b&skv=2026-06-06&sig=1klhPXjEeVnSAkZ5RWuvI6WGEf32e3x2ilk4W/LUOI8%3D"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 240 --silent --show-error "$DEMO_ARCHIVE_URL" -o "$RUNNER_TEMP/v128-artifact.zip"
          echo '27f4ab2128a539283e2ccc15622ca6364c390b044f9f4b1e0d6f4fbf8d99c412  '"$RUNNER_TEMP/v128-artifact.zip" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/v128-artifact.zip"
          mkdir -p "$RUNNER_TEMP/v128-web"
          unzip -q "$RUNNER_TEMP/v128-artifact.zip" '02_게임빌드/hansan-game/web/*' -d "$RUNNER_TEMP/v128-web"
          web="$RUNNER_TEMP/v128-web/02_게임빌드/hansan-game/web"
          for f in index.html index.pck index.js index.wasm; do test -s "$web/$f"; done
          echo '1f29ee103c3ded7feda199f25c8fe0276f5e196684cce59753bd63975ef8d9c3  '"$web/index.html" | sha256sum -c -
          echo '0e94b12f1fa9d0ce4273174da8aba7c78ef2a540852f53b54825d645e7b54f18  '"$web/index.pck" | sha256sum -c -
          test "$(stat -c %s "$web/index.pck")" -eq 71046528
          test "$(stat -c %s "$web/index.wasm")" -eq 39509339
          grep -Fq 'hansan-enable-audio' "$web/index.html"
          grep -Fq 'window.__hansanAudioUnlockReady();' "$web/index.html"
          echo 'V128_ARTIFACT_INTEGRITY_PASSED'
      - name: Replace only hansan-demo and preserve website homepage
        shell: bash
        run: |
          set -euo pipefail
          sha_before=$(sha256sum index.html | awk '{print $1}')
          web="$RUNNER_TEMP/v128-web/02_게임빌드/hansan-game/web"
          rm -rf hansan-demo
          mkdir -p hansan-demo
          cp -a "$web/." hansan-demo/
          touch hansan-demo/.nojekyll .nojekyll
          sha_after=$(sha256sum index.html | awk '{print $1}')
          test "$sha_before" = "$sha_after"
          for f in index.html index.pck index.js index.wasm; do test -s "hansan-demo/$f"; done
          echo '0e94b12f1fa9d0ce4273174da8aba7c78ef2a540852f53b54825d645e7b54f18  hansan-demo/index.pck' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- hansan-demo .nojekyll
          git commit -m 'deploy: V128 bilingual 1-1 to 1-2 demo with transparent English cinematic captions'
          git push origin HEAD:main
          echo "V128_SITE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo 'V128_PUBLIC_REPO_UPDATED'
      - name: Prepare full GitHub Pages site (without Git metadata)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages-site"
          tar --exclude=.git --exclude=.github -cf - . | (cd "$RUNNER_TEMP/pages-site" && tar -xf -)
          test -s "$RUNNER_TEMP/pages-site/index.html"
          echo '1f29ee103c3ded7feda199f25c8fe0276f5e196684cce59753bd63975ef8d9c3  '"$RUNNER_TEMP/pages-site/hansan-demo/index.html" | sha256sum -c -
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site
      - name: Publish website on GitHub Pages
        uses: actions/deploy-pages@v4
      - name: Validate live V128 demo HTML and game pack availability
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --connect-timeout 10 --max-time 30                 "https://walexjung.github.io/hansan-demo/index.html?verify=$GITHUB_RUN_ID"                 -o "$RUNNER_TEMP/live-index.html"; then
              if echo '1f29ee103c3ded7feda199f25c8fe0276f5e196684cce59753bd63975ef8d9c3  '"$RUNNER_TEMP/live-index.html" | sha256sum -c -; then
                verified=1
                break
              fi
            fi
            sleep 7
          done
          test "$verified" = 1
          curl -fsSI --connect-timeout 10 --max-time 25 'https://walexjung.github.io/hansan-demo/index.pck' >/dev/null
          echo "V128_LIVE_PAGE_VERIFIED https://walexjung.github.io/hansan-demo/"
          echo "Public repository commit: $V128_SITE_COMMIT"

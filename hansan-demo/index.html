		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<script id="hansan-audio-bootstrap">
(function(){
 const contexts=[];
 for (const name of ["AudioContext","webkitAudioContext"]) {
  const Orig=window[name];if(!Orig)continue;
  function Capture() {
   const ctx=Reflect.construct(Orig,Array.from(arguments),Orig);
   contexts.push(ctx);return ctx;
  }
  Object.setPrototypeOf(Capture,Orig);Capture.prototype=Orig.prototype;
  window[name]=Capture;
 }
 function resume() {
  for(const ctx of contexts)if(ctx.state!=="running"){
   try{const p=ctx.resume();if(p&&p.catch)p.catch(console.warn);}
   catch(e){console.warn("Hansan audio unlock:",e);}
  }
 }
 window.addEventListener("pointerdown",resume,true);
 window.addEventListener("keydown",resume,true);
 const btn=document.getElementById("hansan-enable-audio");
 function start(){resume();btn.remove();document.getElementById("canvas").focus();}
 btn.addEventListener("pointerdown",start,{once:true});
 btn.addEventListener("keydown",function(e){
  if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}
 });
 window.__hansanAudioUnlockReady=function(){
  if(!btn.isConnected)return;
  const params=new URLSearchParams(location.search);
  const en=params.get("lang")==="en"||
    (!params.has("lang")&&!navigator.language.toLowerCase().startsWith("ko"));
  if(en){
   document.getElementById("hansan-audio-title").textContent="🔊 Enable sound and start";
   document.getElementById("hansan-audio-subtitle").textContent=
     "Click or tap to enable audio in your browser";
  }
  btn.style.display="flex";btn.focus();
 };
})();
</script><script src="index.js"></script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":71035312,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}


	async function startWebDemo() {
		// Replace the exported pack's directory and two resources in memory.
		// All the original game assets, including the video and audio, are reused.
		const data = document.getElementById("hansan-web-language");
		const compressed = Uint8Array.from(atob(data.textContent), char => char.charCodeAt(0));
		const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
		const resources = new Uint8Array(await new Response(stream).arrayBuffer());
		const localized = new Uint8Array(70953744 + resources.length);
		await Promise.all([downloadPack(localized), engine.init("index")]);
		localized.set(resources, 70953744);
		new DataView(localized.buffer).setUint32(32, 71021632, true);
		await engine.preloadFile(localized.buffer, "index.pck");
		await engine.start({args: ["--main-pack", "index.pck"]});
	}

	async function downloadPack(localized) {
		const response = await fetch("index.pck");
		if (!response.ok) throw new Error("Could not download the demo.");
		const reader = response.body.getReader();
		let received = 0;
		statusProgress.max = 71035312;
		while (true) {
			const {done, value} = await reader.read();
			if (done) break;
			const remaining = Math.max(0, 70953744 - received);
			if (remaining) localized.set(value.subarray(0, remaining), received);
			received += value.length;
			statusProgress.value = received;
		}
		const header = new DataView(localized.buffer);
		if (received !== 71035312 || header.getUint32(0, true) !== 0x43504447 ||
			header.getUint32(32, true) !== 70953744 || header.getUint32(36, true) !== 0) {
			throw new Error("The demo files are from different versions. Refresh and try again.");
		}
	}


	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		startWebDemo().then(() => {
			setStatusMode('hidden');
            window.__hansanAudioUnlockReady();
		}, displayFailureNotice);
	}
}());
